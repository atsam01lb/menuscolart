<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website Suspended</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23c0392b'/%3E%3Crect x='10' y='9' width='4' height='14' rx='1' fill='%23fff'/%3E%3Crect x='18' y='9' width='4' height='14' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2933;--mut:#616e7c;--line:#e4e7eb;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#f1f3f5;--mut:#9aa5b1;--line:#2c323b;--red:#e5574a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
.card{width:min(100%,520px);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 28px 36px;box-shadow:0 18px 50px rgba(0,0,0,.08);animation:in .6s cubic-bezier(.2,.8,.2,1) backwards}
.icon{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.icon svg{width:38px;height:38px}
h1{font-size:clamp(26px,6vw,34px);font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
p{color:var(--mut);font-size:16.5px;max-width:42ch;margin:0 auto}
.contact{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-size:16px;color:var(--mut)}
.contact a{display:inline-block;margin-top:4px;color:var(--ink);font-weight:700;font-size:20px;letter-spacing:.4px;text-decoration:none;border-bottom:2px solid var(--red);padding-bottom:1px}
.contact a:hover{color:var(--red)}
.contact a:focus-visible{outline:3px solid var(--red);outline-offset:4px}
@keyframes in{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="10" y1="8.5" x2="10" y2="15.5"/><line x1="14" y1="8.5" x2="14" y2="15.5"/></svg>
  </div>
  <h1>Website Suspended</h1>
  <p>This website has been temporarily suspended.</p>
  <p style="margin-top:10px">If you are the website owner, please contact the administrator to restore your service.</p>
  <div class="contact">
    Contact Administrator:<br>
    <a href="tel:+96170649423" dir="ltr">+96170649423</a>
  </div>
</main>
</body>
</html>
