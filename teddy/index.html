<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy | Coming Soon</title>
<meta name="description" content="Teddy's digital menu is coming soon.">
<meta name="theme-color" content="#3a5350">
<link rel="icon" type="image/svg+xml" href="assets/logo-square.svg">
<link rel="apple-touch-icon" href="assets/logo-square.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb orb--a"></span><span class="orb orb--b"></span><span class="orb orb--c"></span>
  <span class="dot" style="--x:12%;--y:22%;--s:10px;--d:7s;--t:0s"></span>
  <span class="dot" style="--x:84%;--y:18%;--s:14px;--d:9s;--t:-2s"></span>
  <span class="dot" style="--x:74%;--y:70%;--s:8px;--d:6s;--t:-1s"></span>
  <span class="dot" style="--x:20%;--y:78%;--s:12px;--d:8s;--t:-4s"></span>
  <span class="dot" style="--x:50%;--y:12%;--s:6px;--d:10s;--t:-3s"></span>
</div>

<main class="stage">
  <div class="logo-wrap">
    <img class="logo" src="assets/logo.svg" alt="Teddy" width="874" height="428">
  </div>

  <div class="badge"><span class="badge__pulse" aria-hidden="true"></span>Coming Soon</div>

  <h1 class="title">Our Menu</h1>
  <p class="sub">We are getting our digital menu ready. Stay tuned.</p>

  <div class="bar" aria-hidden="true"><i></i></div>

</main>

<footer class="footer">
  <p class="footer__copy">&copy; <span id="year">2026</span> Teddy</p>
  <div class="footer__credits">
    <span>Structured by <a href="https://www.colartdigitalmarketingagency.com" target="_blank" rel="noopener">Colart Digital Marketing Agency</a></span>
    <span class="footer__sep" aria-hidden="true">&middot;</span>
    <span>Hosted by <a href="https://menus.colartdigitalmarketingagency.com" target="_blank" rel="noopener">Menus by Colart</a></span>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
